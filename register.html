<!DOCTYPE html>
<html>

<head>

<title>Register</title>

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-4">

<div class="card shadow">

<button class="btn btn-success w-100">Create</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
